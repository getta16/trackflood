name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ดึงข้อมูล GISTDA ใหม่ทุก 3 ชั่วโมง
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      # น้ำท่วมซ้ำซากเป็นข้อมูลรายปี เก็บ cache ไว้ ไม่ต้องดึงใหม่ทุกรอบ
      - uses: actions/cache@v4
        with:
          path: |
            public/data/gistda/flood-freq.json
            public/data/gistda/flood-freq-summary.json
          key: gistda-freq-${{ github.run_id }}
          restore-keys: gistda-freq-
      - name: Fetch GISTDA data
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: node scripts/fetch-gistda.js
      - name: Build download files (GeoJSON, Shapefile, KMZ)
        run: |
          if [ -d public/data/gistda/downloads ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin zip > /dev/null
          fi
          node scripts/build-downloads.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
