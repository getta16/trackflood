name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ดึงข้อมูล GISTDA ใหม่ทุก 3 ชั่วโมง
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch GISTDA data
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: node scripts/fetch-gistda.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
