<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ventusky - Embed</title>
<!-- ตัวห่อ embed ของ Ventusky: บังคับภาษาให้ใช้หน่วยเมตริก (มม.)
     Ventusky เลือกหน่วยจากภาษาเบราว์เซอร์ ถ้าเป็น en-US จะแสดงเป็นนิ้ว จึงแทนภาษาเป็น en-GB ก่อนโหลดสคริปต์ -->
<base href="https://embed.ventusky.com/">
<link rel="stylesheet" href="https://static.ventusky.com/media/embed.css">
<script>
  (function () {
    var lang = (navigator.language || 'en').toLowerCase();
    if (lang === 'en-us' || lang === 'en') {
      try { Object.defineProperty(Navigator.prototype, 'language', { get: function () { return 'en-gb'; }, configurable: true }); } catch (e) {}
    }
  })();
</script>
</head>
<body>
  <br />
  <a href="https://www.ventusky.com/" target="_blank" rel="noopener"><div class="logo"></div></a>
  <style>#d { display: none; }</style>
  <form id="header"><label><input name="q" /></label><ul><li class="progress"></li></ul></form>
  <menu style="display:none"></menu>
  <script>
    var s = document.createElement('script');
    s.src = 'https://embed.ventusky.com/embed.js?' + Math.floor(Date.now() / 60000) * 60;
    document.head.appendChild(s);
  </script>
</body>
</html>
